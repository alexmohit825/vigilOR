<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Crisp Pure White Base with Subtle Vignette -->
    <linearGradient id="whiteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff"/>
      <stop offset="60%" stopColor="#f8fafc"/>
      <stop offset="100%" stopColor="#f1f5f9"/>
    </linearGradient>

    <!-- Deep Midnight Sapphire Shield Fill -->
    <linearGradient id="deepShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0b1e36"/>
      <stop offset="50%" stopColor="#0f172a"/>
      <stop offset="100%" stopColor="#030712"/>
    </linearGradient>

    <!-- Electric Cyan to Teal Pulse Gradient -->
    <linearGradient id="laserPulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#00f2fe"/>
      <stop offset="50%" stopColor="#38bdf8"/>
      <stop offset="100%" stopColor="#10b981"/>
    </linearGradient>

    <!-- Polished Gold Stars Gradient -->
    <linearGradient id="pureGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#fef08a"/>
      <stop offset="40%" stopColor="#fbbf24"/>
      <stop offset="80%" stopColor="#f59e0b"/>
      <stop offset="100%" stopColor="#d97706"/>
    </linearGradient>

    <!-- Crisp Drop Shadow for 3D Pop on White -->
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>

    <!-- Glowing Pulse Filter -->
    <filter id="pulseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ==================== BASE WHITE SQUIRCLE ==================== -->
  <rect width="512" height="512" rx="116" fill="url(#whiteBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="#e2e8f0" stroke-width="4"/>

  <!-- ==================== MASSIVE GUARDIAN SHIELD (90% Canvas Fill) ==================== -->
  <g filter="url(#shieldShadow)">
    <!-- Outer Deep Shield Armor Body -->
    <path d="M 256,28 
             L 456,98 
             C 456,298 376,438 256,488 
             C 136,438 56,298 56,98 Z" 
          fill="url(#deepShieldGrad)" 
          stroke="#0284c7" 
          stroke-width="12" 
          stroke-linejoin="round"/>

    <!-- Inner Metallic Inset Border -->
    <path d="M 256,54 
             L 426,114 
             C 426,282 358,404 256,448 
             C 154,404 86,282 86,114 Z" 
          fill="none" 
          stroke="#1e3a8a" 
          stroke-width="6" 
          opacity="0.9"/>
  </g>

  <!-- ==================== BOLD NEURAL SPINE SEGMENTS ==================== -->
  <g>
    <!-- Segment C1 -->
    <rect x="216" y="156" width="80" height="24" rx="8" fill="#1e3a8a" stroke="#38bdf8" stroke-width="3"/>
    <!-- Segment T1 -->
    <rect x="206" y="196" width="100" height="26" rx="8" fill="#0f766e" stroke="#2dd4bf" stroke-width="3"/>
    <!-- Segment T2 (Center Lumbar) -->
    <rect x="198" y="240" width="116" height="28" rx="8" fill="#047857" stroke="#34d399" stroke-width="3"/>
    <!-- Segment L1 -->
    <rect x="206" y="286" width="100" height="26" rx="8" fill="#1e3a8a" stroke="#38bdf8" stroke-width="3"/>
    <!-- Segment L2 -->
    <rect x="216" y="330" width="80" height="24" rx="8" fill="#0f766e" stroke="#2dd4bf" stroke-width="3"/>
  </g>

  <!-- ==================== ULTRA-VIBRANT ELECTRIC CYAN & EMERALD PULSE ==================== -->
  <g filter="url(#pulseGlow)">
    <!-- High-Energy Heartbeat / Neural Action Potential (18px Stroke) -->
    <path d="M 98,254 
             L 164,254 
             L 198,178 
             L 236,334 
             L 276,178 
             L 314,334 
             L 348,254 
             L 414,254" 
          fill="none" 
          stroke="url(#laserPulseGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- High-Contrast Bright Synaptic Nodes -->
    <circle cx="98" cy="254" r="11" fill="#00f2fe"/>
    <circle cx="414" cy="254" r="11" fill="#10b981"/>
    <circle cx="198" cy="178" r="9" fill="#ffffff"/>
    <circle cx="276" cy="178" r="9" fill="#ffffff"/>
    <circle cx="236" cy="334" r="9" fill="#34d399"/>
    <circle cx="314" cy="334" r="9" fill="#38bdf8"/>
  </g>

  <!-- ==================== LARGE 5-STAR GOLD REPUTATION CREST ==================== -->
  <g>
    <!-- Star 1 -->
    <polygon points="144,112 150,128 166,128 153,138 158,154 144,144 130,154 135,138 122,128 138,128" fill="url(#pureGoldGrad)" stroke="#78350f" stroke-width="1.5"/>
    
    <!-- Star 2 -->
    <polygon points="200,90 206,106 222,106 209,116 214,132 200,122 186,132 191,116 178,106 194,106" fill="url(#pureGoldGrad)" stroke="#78350f" stroke-width="1.5"/>
    
    <!-- Star 3 (Center Crown Star - Extra Large & Prominent) -->
    <polygon points="256,72 265,94 288,94 270,108 276,130 256,116 236,130 242,108 224,94 247,94" fill="url(#pureGoldGrad)" stroke="#78350f" stroke-width="2"/>
    <circle cx="256" cy="101" r="3.5" fill="#ffffff"/>

    <!-- Star 4 -->
    <polygon points="312,90 318,106 334,106 321,116 326,132 312,122 298,132 303,116 290,106 306,106" fill="url(#pureGoldGrad)" stroke="#78350f" stroke-width="1.5"/>
    
    <!-- Star 5 -->
    <polygon points="368,112 374,128 390,128 377,138 382,154 368,144 354,154 359,138 346,128 362,128" fill="url(#pureGoldGrad)" stroke="#78350f" stroke-width="1.5"/>
  </g>

  <!-- Center Luminous White Spark -->
  <circle cx="256" cy="254" r="8" fill="#ffffff"/>
</svg>
