name: VigilOR Autonomous Sentinel Cron

on:
  schedule:
    # Runs every 15 minutes (or adjust as needed)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  vigilor-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run VigilOR Autonomous CalDAV Sync
        env:
          VIGILOR_APPLE_ID: ${{ secrets.VIGILOR_APPLE_ID }}
          VIGILOR_APP_PASSWORD: ${{ secrets.VIGILOR_APP_PASSWORD }}
          VIGILOR_CALENDAR: 'Personal'
        run: node scripts/sentinel_worker.js
