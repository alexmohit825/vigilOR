name: 🚀 Deploy VigilOR to Apple TestFlight

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'App Marketing Version'
        required: false
        default: '1.0.0'

concurrency:
  group: 'testflight'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: 📲 Build Native Swift App & Deliver to TestFlight
    runs-on: macos-15

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: 🛠️ Select Xcode 16 / iOS 18 SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: 🔑 Configure App Store Connect API Key & Code Signing Keychain
        env:
          APP_STORE_CONNECT_KEY_ID: '38F6WA87DU'
          APP_STORE_CONNECT_ISSUER_ID: '73c7355a-beef-4d79-919d-c3d7dec7747a'
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          # 1. Setup ASC API Key
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          
          # 2. Setup Distribution Certificate Keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=temporal_pass
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          echo "$APPLE_DISTRIBUTION_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          echo "✅ Apple Distribution Certificate & API Key configured in secure runner keychain."

      - name: 📦 Build and Archive Native iOS App with Xcode 16
        run: |
          cd ios
          xcodebuild archive \
            -project VigilOR.xcodeproj \
            -scheme VigilOR \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/VigilOR.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 📱 Export IPA with Automatic Apple Provisioning
        run: |
          cd ios
          xcodebuild -exportArchive \
            -archivePath build/VigilOR.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/Export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8 \
            -authenticationKeyID 38F6WA87DU \
            -authenticationKeyIssuerID 73c7355a-beef-4d79-919d-c3d7dec7747a

      - name: 🚀 Validate & Deliver to TestFlight via Apple API
        env:
          KEY_ID: '38F6WA87DU'
          ISSUER_ID: '73c7355a-beef-4d79-919d-c3d7dec7747a'
        run: |
          IPA_PATH=$(find ios/build/Export -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "Error: IPA file was not generated."
            exit 1
          fi
          echo "Found IPA at: $IPA_PATH"
          echo "Transmitting VigilOR build to App Store Connect TestFlight..."
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
          
          echo "=========================================================="
          echo "🎉 VigilOR Build #${{ github.run_number }} Successfully Delivered to Apple TestFlight!"
          echo "Target Bundle: com.AlexMohit.VigilOR"
          echo "App Store Connect is processing the build for your iPhone."
          echo "=========================================================="
