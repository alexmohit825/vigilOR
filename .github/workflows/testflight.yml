name: 🚀 Deploy VigilOR to Apple TestFlight

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'App Marketing Version'
        required: false
        default: '1.0.0'

concurrency:
  group: 'testflight'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: 📲 Build Native Swift App & Deliver to TestFlight
    runs-on: macos-14

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: 🛠️ Select Xcode 15.4 SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: 🔑 Configure App Store Connect API Key
        env:
          APP_STORE_CONNECT_KEY_ID: '38F6WA87DU'
          APP_STORE_CONNECT_ISSUER_ID: '73c7355a-beef-4d79-919d-c3d7dec7747a'
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          echo "✅ Apple ASC API key configured in secure runner keychain."

      - name: 📦 Build and Archive Native iOS App
        run: |
          cd ios
          xcodebuild archive \
            -project VigilOR.xcodeproj \
            -scheme VigilOR \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/VigilOR.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 📱 Export IPA with Automatic Apple Provisioning
        run: |
          cd ios
          xcodebuild -exportArchive \
            -archivePath build/VigilOR.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/Export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8 \
            -authenticationKeyID 38F6WA87DU \
            -authenticationKeyIssuerID 73c7355a-beef-4d79-919d-c3d7dec7747a

      - name: 🚀 Validate & Deliver to TestFlight via Apple API
        env:
          KEY_ID: '38F6WA87DU'
          ISSUER_ID: '73c7355a-beef-4d79-919d-c3d7dec7747a'
        run: |
          IPA_PATH=$(find ios/build/Export -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "Error: IPA file was not generated."
            exit 1
          fi
          echo "Found IPA at: $IPA_PATH"
          echo "Transmitting VigilOR build to App Store Connect TestFlight..."
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
          
          echo "=========================================================="
          echo "🎉 VigilOR Successfully Delivered to Apple TestFlight!"
          echo "Target Bundle: com.AlexMohit.VigilOR"
          echo "App Store Connect is processing the build for your iPhone."
          echo "=========================================================="
