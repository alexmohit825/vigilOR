name: 🚀 Deploy VigilOR to Apple TestFlight

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'App Marketing Version'
        required: false
        default: '1.0.0'

concurrency:
  group: 'testflight'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: 📲 Build Native Swift App & Deliver to TestFlight
    runs-on: macos-15

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: 🛠️ Select Xcode 16 / iOS 18 SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: 🔑 Configure App Store Connect API Key
        env:
          APP_STORE_CONNECT_KEY_ID: '38F6WA87DU'
          APP_STORE_CONNECT_ISSUER_ID: '73c7355a-beef-4d79-919d-c3d7dec7747a'
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          python3 -m pip install pyjwt requests cryptography
          echo "✅ Apple ASC API key and tools configured."

      - name: 📦 Compile Native VigilOR Swift App & Assets
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          TARGET="arm64-apple-ios17.0"
          BUILD_NUM="${{ github.run_number }}"
          
          mkdir -p build/Payload/VigilOR.app
          
          swiftc \
            -target $TARGET \
            -sdk $SDK_PATH \
            -O \
            -parse-as-library \
            ios/VigilOR/VigilORApp.swift \
            ios/VigilOR/ContentView.swift \
            ios/VigilOR/Services/CalendarManager.swift \
            ios/VigilOR/Services/MailManager.swift \
            -o build/Payload/VigilOR.app/VigilOR
          
          # Compile Asset Catalog for device (iphoneos)
          xcrun actool \
            ios/VigilOR/Assets.xcassets \
            --compile build/Payload/VigilOR.app \
            --platform iphoneos \
            --minimum-deployment-target 17.0 \
            --app-icon AppIcon \
            --output-partial-info-plist build/assetcatalog_info.plist
          
          # Update Info.plist with dynamic build number
          sed -i '' "s/<string>1<\/string>/<string>${BUILD_NUM}<\/string>/g" ios/VigilOR/Info.plist
          cp ios/VigilOR/Info.plist build/Payload/VigilOR.app/Info.plist
          
          # Fetch and embed official Apple Distribution Provisioning Profile
          python3 ios/fetch_provisioning_profile.py build/Payload/VigilOR.app/embedded.mobileprovision
          
          echo "✅ VigilOR app bundle assembled successfully for arm64 iOS (Build #${BUILD_NUM})."

      - name: 📱 Package Application into IPA
        run: |
          cd build
          zip -qr ../VigilOR.ipa Payload
          cd ..
          echo "✅ VigilOR.ipa created ($(ls -lh VigilOR.ipa | awk '{print $5}'))."

      - name: 🚀 Validate & Deliver to TestFlight via Apple API
        env:
          KEY_ID: '38F6WA87DU'
          ISSUER_ID: '73c7355a-beef-4d79-919d-c3d7dec7747a'
        run: |
          echo "Transmitting VigilOR build to App Store Connect TestFlight..."
          xcrun altool --upload-app \
            -f VigilOR.ipa \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
          
          echo "=========================================================="
          echo "🎉 VigilOR Build #${{ github.run_number }} Successfully Delivered to Apple TestFlight!"
          echo "Target Bundle: com.AlexMohit.VigilOR"
          echo "App Store Connect is processing the build for your iPhone."
          echo "=========================================================="
