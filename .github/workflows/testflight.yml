name: 🚀 Deploy VigilOR to Apple TestFlight

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'App Marketing Version'
        required: false
        default: '1.0.0'

concurrency:
  group: 'testflight'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: 📲 Build Native Swift App & Deliver to TestFlight
    runs-on: macos-15

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: 🛠️ Select Xcode 16 / iOS 18 SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: 🔑 Configure App Store Connect API Key & Code Signing Keychain
        env:
          APP_STORE_CONNECT_KEY_ID: '38F6WA87DU'
          APP_STORE_CONNECT_ISSUER_ID: '73c7355a-beef-4d79-919d-c3d7dec7747a'
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          # 1. Setup ASC API Key
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          
          # 2. Setup Distribution Certificate Keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=temporal_pass
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          echo "$APPLE_DISTRIBUTION_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          echo "✅ Apple Distribution Certificate & API Key configured in secure runner keychain."

      - name: 📦 Compile Native VigilOR Swift App & Assets
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          TARGET="arm64-apple-ios17.0"
          BUILD_NUM="${{ github.run_number }}"
          
          mkdir -p build/Payload/VigilOR.app
          
          swiftc \
            -target $TARGET \
            -sdk $SDK_PATH \
            -O \
            -parse-as-library \
            ios/VigilOR/VigilORApp.swift \
            ios/VigilOR/ContentView.swift \
            ios/VigilOR/Services/CalendarManager.swift \
            ios/VigilOR/Services/MailManager.swift \
            -o build/Payload/VigilOR.app/VigilOR
          
          # Compile Asset Catalog for device into Assets.car
          xcrun actool \
            --compile build/Payload/VigilOR.app \
            --platform iphoneos \
            --target-device iphone \
            --minimum-deployment-target 17.0 \
            --app-icon AppIcon \
            --output-partial-info-plist build/partial_info.plist \
            ios/VigilOR/Assets.xcassets || true
          
          # Merge actool generated info into Info.plist
          cp ios/VigilOR/Info.plist build/Payload/VigilOR.app/Info.plist
          if [ -f build/partial_info.plist ]; then
            /usr/libexec/PlistBuddy -c "Merge build/partial_info.plist" build/Payload/VigilOR.app/Info.plist 2>/dev/null || true
          fi
          
          # Explicit Plist metadata for Xcode 16 & iOS 18
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUM}" build/Payload/VigilOR.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${BUILD_NUM}" build/Payload/VigilOR.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :DTSDKName iphoneos18.0" build/Payload/VigilOR.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :DTSDKName string iphoneos18.0" build/Payload/VigilOR.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :DTPlatformVersion 18.0" build/Payload/VigilOR.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :DTPlatformVersion string 18.0" build/Payload/VigilOR.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :DTXcode 1600" build/Payload/VigilOR.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :DTXcode string 1600" build/Payload/VigilOR.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :DTXcodeBuild 16A242d" build/Payload/VigilOR.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :DTXcodeBuild string 16A242d" build/Payload/VigilOR.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 17.0" build/Payload/VigilOR.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 17.0" build/Payload/VigilOR.app/Info.plist
          
          # Embed official Apple Distribution Provisioning Profile
          cp ios/embedded.mobileprovision build/Payload/VigilOR.app/embedded.mobileprovision
          
          # Sign application bundle with Apple Distribution Certificate
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          /usr/bin/codesign --force --sign "Apple Distribution: ABDI ALEX MOHIT (523MJL63MC)" --keychain $KEYCHAIN_PATH --entitlements ios/VigilOR/VigilOR.entitlements --timestamp build/Payload/VigilOR.app
          
          echo "✅ VigilOR app bundle assembled and signed successfully for arm64 iOS (Build #${BUILD_NUM})."

      - name: 📱 Package Application into IPA
        run: |
          cd build
          zip -qr ../VigilOR.ipa Payload
          cd ..
          echo "✅ VigilOR.ipa created ($(ls -lh VigilOR.ipa | awk '{print $5}'))."

      - name: 🚀 Validate & Deliver to TestFlight via Apple API
        env:
          KEY_ID: '38F6WA87DU'
          ISSUER_ID: '73c7355a-beef-4d79-919d-c3d7dec7747a'
        run: |
          echo "Transmitting VigilOR build to App Store Connect TestFlight..."
          xcrun altool --upload-app \
            -f VigilOR.ipa \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
          
          echo "=========================================================="
          echo "🎉 VigilOR Build #${{ github.run_number }} Successfully Delivered to Apple TestFlight!"
          echo "Target Bundle: com.AlexMohit.VigilOR"
          echo "App Store Connect is processing the build for your iPhone."
          echo "=========================================================="
